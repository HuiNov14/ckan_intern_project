{% asset 'api_tracking/sort_chart-css' %}
<div class="row g-0 justify-content-end align-items-center">
  <!-- Loại biểu đồ -->
  <div class="col-md-4 mb-3 custom-col">
    <div class="d-flex flex-column align-items-end">
      <select id="chartType">
        {% for option in h.get_chart_type() %}
        <option value="{{ option['value'] }}" {% if option['selected'] %}selected{% endif %}>
          {{ option['label'] }}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>

<!-- Biểu đồ thống kê -->
<div class="container">
  <canvas id="statisticsChart"></canvas>
</div>

<!-- Thông báo không có tài nguyên -->
<div id="noResourceMessage" class="mt-3 text-center text-danger fw-bold" style="display: none;">{{ _('No resources have been accessed.') }}</div>
